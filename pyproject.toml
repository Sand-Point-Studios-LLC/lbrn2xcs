[project]
name = "lbrn2xcs"
version = "0.0.1"
description = "Batch-convert LightBurn projects (.lbrn/.lbrn2) toward xTool Creative Space (XCS), via SVG/DXF (and experimental native .xcs)."
requires-python = ">=3.13"
# defusedxml prevents XXE attacks in user-supplied .lbrn files.
# ezdxf is imported lazily — SVG and .xcs output work without it.
# (SVG is written directly rather than via svgwrite, so beziers and mm units survive.)
dependencies = [
    "ezdxf>=1.1",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
lbrn2xcs = "lbrn2xcs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "TID", "ISC"]

# TID rule: Prevents direct anthropic/openai imports; route via LiteLLM gateway (vigil-server:9002).
# See ~/dev-context/guides/llm-gateway-lint-rule.md for details and exemption guidance.
